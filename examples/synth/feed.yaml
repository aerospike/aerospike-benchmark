# Activity feed: append one event per write, keep the last 100 per user,
# read the last 10.
# asbench -h 127.0.0.1 -n test -s feed --workload-stages examples/synth/feed.yaml
- stage: 1
  desc: "activity feed, 80% reads of the latest 10 events"
  workload: C,80,100,10
  duration: 60
  key-start: 1
  key-end: 1000001
  object-spec: 'events=[1*{"ts":@timestamp("2024-01-01","2025-12-31"),"type":@pick("view":70,"click":25,"buy":5),"sku":@product}], updated=@now'

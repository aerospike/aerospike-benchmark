security {
}

service {
	cluster-name asbench-test
	feature-key-file env-b64:FEATURES
	run-as-daemon false
	proto-fd-max 1024
	transaction-retry-ms 10000
	transaction-max-ms 10000
}

logging {
	console {
		context any info
	}
}

network {
	service {
		port ${service_port}
		address any
		access-address 127.0.0.1 virtual
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		interval 100
		timeout 3
		connect-timeout-ms 100
	}

	fabric {
		port 3001
		address any
	}
}

namespace ${namespace} {
	replication-factor 1
	default-ttl 0
	storage-engine memory {
		data-size 512M
	}
	nsup-period 60
}

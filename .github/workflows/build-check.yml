# Lightweight installer build check.
#
# Purpose: catch dependency / packaging regressions on every push, before
# they reach the full release pipeline. The release workflow builds for 11
# distros × 2 arches + signing + notarization — too heavy for every commit.
#
# This workflow exercises both fpm code paths (deb on Ubuntu, rpm on EL) on
# amd64 so a regression in either format surfaces early. macOS pkg builds
# are deferred to the release workflow (macOS runners are ~10x more
# expensive); note that leaves the macOS .pkg naming and the prep-mac guard
# in pkg/Makefile unexercised here, so changes to those still need a
# dispatched release to validate end to end.
#
# The naming-scripts job covers what the release workflow cannot: that workflow
# is workflow_dispatch-only, so pkg_release.sh (which every artifact name and
# image tag is derived from) and version_lib.sh (which gates whether a release
# ships) would otherwise first run during a real release. Both suites are pure
# string logic -- no packaging, no installed asbench -- so they are cheap here.
#
# test.yml verifies the binary build via `make`. This adds coverage for
# the *packaging* step (install_deps → make → fpm).

name: Build check (installer)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read

# /bin/sh is dash on Debian/Ubuntu; force bash for `set -o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  naming-scripts:
    name: Naming scripts (pkg_release, version_lib)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install bats
        env:
          BATS_VERSION: "1.11.0"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o /tmp/bats.tgz
          tar -xzf /tmp/bats.tgz -C /tmp
          sudo "/tmp/bats-core-${BATS_VERSION}/install.sh" /usr/local
          bats --version

      - name: Test pkg_release.sh and version_lib.sh
        run: |
          set -euo pipefail
          bats .github/bin/test/pkg_release.bats .github/bin/test/version_lib.bats

      # The .deb/.rpm legs below only count that a package appeared; nothing
      # asserts the NAME. Assert it here, where the expected name is derived
      # from the same script pkg/Makefile uses, so the two cannot drift.
      - name: Assert package names for an rc version
        run: |
          set -euo pipefail
          release=$(.github/bin/pkg_release.sh 2.2.10-rc3 release)
          pkg_version=$(.github/bin/pkg_release.sh 2.2.10-rc3 version)
          iteration=$(.github/bin/pkg_release.sh 2.2.10-rc3 iteration)
          [[ "${release}" == "2.2.10-3" ]] || { echo "::error::rc3 resolved to release '${release}', expected 2.2.10-3" >&2; exit 1; }

          # make -n so no build deps are needed. Collect only the emitted
          # --package paths: the rest of the output includes recipe text that
          # legitimately echoes the rcN version.
          names=$(make -C pkg -n deb rpm tar VERSION=2.2.10-rc3 BUILD_DISTRO=ubuntu24.04 \
                  | tr ' ' '\n' | grep -E '\.(deb|rpm|tar)$')
          echo "${names}"
          for want in \
            "_${pkg_version}-${iteration}ubuntu24.04_" \
            "-${pkg_version}-${iteration}.ubuntu24.04." \
            "-${release}-ubuntu24.04-"; do
            printf '%s\n' "${names}" | grep -qF -- "${want}" \
              || { echo "::error::expected '${want}' in the emitted package names" >&2; exit 1; }
          done
          if printf '%s\n' "${names}" | grep -qiE 'rc[0-9]'; then
            echo "::error::an rc identifier leaked into a package name" >&2
            exit 1
          fi
          echo "OK: rcN folded into the iteration, absent from all package names"

  installer-build:
    name: Build .${{ matrix.pkg }} (${{ matrix.distro }}, amd64)
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu24.04, container: 'ubuntu:noble-20251013',     pkg: deb }
          - { distro: ubuntu26.04, container: 'ubuntu:resolute-20260413', pkg: deb }
          - { distro: el10,        container: 'redhat/ubi10:10.0',        pkg: rpm }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install prereqs
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              ;;
            el*|amzn*)
              dnf -y install git ca-certificates
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Mark workspace as safe (for git inside container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/bin/install_deps.sh
          "install_deps_${{ matrix.distro }}"

      - name: Build .${{ matrix.pkg }} installer
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          BUILD_DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          source .github/bin/build_package.sh
          build_packages

      - name: Verify .${{ matrix.pkg }} produced
        run: |
          set -euo pipefail
          count=$(find pkg/target -maxdepth 2 -name "*.${{ matrix.pkg }}" -type f | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No .${{ matrix.pkg }} produced under pkg/target/." >&2
            ls -la pkg/target/ || true
            exit 1
          fi
          echo "Installer build succeeded:"
          find pkg/target -maxdepth 2 -name "*.${{ matrix.pkg }}" -type f

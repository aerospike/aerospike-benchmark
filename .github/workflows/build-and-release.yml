# Build and Release pipeline for asbench (aerospike-benchmark).
#
# Source of truth for the version: the VERSION file at repo root. It carries
# the release candidate too (e.g. 2.2.10-rc1), written by the Bump Version
# workflow. Each respin bumps it to the next -rcN.
#
# get-version emits two strings:
#   VERSION        release identity: git tag, JFrog release bundle, build
#                  number. Off main it also carries the branch and sha.
#   BUILD_VERSION  what artifacts are named from and what the binary is
#                  stamped with. pkg_release.sh splits it into the package
#                  version and iteration, so rcN lands in the deb revision /
#                  rpm Release and never in a file name or image tag.
#
# === Main release flow ===
#   1. Run Bump Version (manual) → opens PR updating VERSION (e.g. 2.2.10-rc1).
#   2. Review + merge the PR to main.
#   3. Dispatch this workflow on main with `release=true`:
#      - Creates and pushes git tag <VERSION> (e.g. 2.2.10-rc1).
#      - Tag push triggers draft-release.yml (drafts GitHub release notes).
#      - Builds + signs + tests + publishes packages to JFrog dev repos.
#      - Creates JFrog release bundle (the promotion unit for any publish).
#   At GA the passing rc is promoted with no rebuild: its 2.2.10-N artifacts
#   are what ship.
#
# === Feature-branch publishing (for external customers without GHA access) ===
#   Dispatch this workflow on any branch with `release=true`:
#      - No git tag is created (tags are main-only).
#      - VERSION is a SemVer 2.0 pre-release identifier that never collides
#        with main:
#            2.2.10-rc1 + branch feature/foo, sha abc123456
#          → VERSION       2.2.10-rc1-feature-foo-abc123456
#          → BUILD_VERSION 2.2.10-abc123456   (sha pins it; iteration stays 1)
#      - Packages are uploaded to the JFrog dev repo. The installable version to
#        pin with apt/dnf is derived from BUILD_VERSION, not VERSION -- that is
#        what names the package:
#            2.2.10-abc123456-1ubuntu24.04    (deb)
#            2.2.10_abc123456-1.el9           (rpm)
#        Note a dev build's version sorts ABOVE a GA release in dpkg/rpm (in
#        deb-version(7) terms, end-of-string sorts before any character except
#        '~'), so a host pinned to one is not offered the GA that follows it.
#        Uninstall the dev build before upgrading.
#      - A release bundle is created so the artifacts can be promoted through
#        JFrog.
#
# === Main feature-style build (publish from main without tagging) ===
#   Dispatch on main with `release=true` and `skip_tagging=true`:
#      - Behaves like a feature-branch build: the main+sha suffix, no git tag.
#        A release bundle is still produced (same as feature-branch publish).
#      - Use when you want to publish a build from main for testing/
#        validation without committing to a real release.
#
# === Test (dry-run) ===
#   Dispatch with `release=false` from any branch: builds run end-to-end,
#   artifacts available on the GHA run page, no tag, no JFrog publish,
#   no release bundle.
#
# === Tagging rules (summary) ===
#   Tagging is main-only. A git tag is created ONLY when:
#       release=true  AND  ref==refs/heads/main  AND  skip_tagging=false
#   For any non-main branch tagging is unconditionally skipped, regardless
#   of `release` or `skip_tagging`. Release bundles, by contrast, are produced
#   on every publish (`release=true`) regardless of branch or `skip_tagging`,
#   since the bundle is what enables JFrog promotion.

name: Build and Release testing
permissions:
  contents: read
  id-token: write
  attestations: write
defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish packages to JFrog (and push Docker tags) and create a JFrog release bundle (the promotion unit). On main, also creates the git tag from VERSION. On non-main branches, the git tag is always skipped. Uncheck for a dry-run build (no publish, no bundle)."
        type: boolean
        default: false
      skip_tagging:
        description: "Skip the git tag even on main (treat as feature-style build). Release bundle is still produced when release=true. No effect on non-main branches, which never tag."
        type: boolean
        default: false

# Two runs on the same ref resolve to the same VERSION and race each other to
# the same artifact paths (deb/rpm pools are flat: last write wins).
# cancel-in-progress: false so a half-published run is never interrupted; a
# second dispatch waits for it. Note this is not a queue -- a group holds one
# in-progress run and at most one PENDING run, so a third dispatch cancels the
# waiting one rather than lining up behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate VERSION file
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      VERSION: ${{ steps.read.outputs.VERSION }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read and validate VERSION
        id: read
        env:
          SKIP_TAGGING: ${{ inputs.skip_tagging }}
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing at repo root." >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ -z "$VERSION" ]]; then
            echo "::error::VERSION file is empty." >&2
            exit 1
          fi
          # rcN folds into the package iteration by number, so rc01 and rc1 would
          # name one package from two tags; artifact names are all lowercase.
          if [[ "$VERSION" =~ -[Rr][Cc] ]] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]{0,3}$ ]]; then
            echo "::error::VERSION '$VERSION': the release candidate identifier must be lowercase rc1..rc9999 with no leading zero (e.g. 2.2.10-rc1)." >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?$ ]]; then
            echo "::error::VERSION '$VERSION' is not valid semver (expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-suffix, lowercase, e.g. 2.2.10-rc1)." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${SKIP_TAGGING}" != "true" ]]; then
            # Reject a reused version before anything is built. create-tag checks
            # this too, but only after the packages and the release bundle are
            # published -- by then the previous build's files in the flat deb/rpm
            # pools have already been overwritten.
            if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::Tag '${VERSION}' already exists. Bump VERSION (Bump Version workflow) to the next -rcN before releasing again." >&2
              exit 1
            fi

            # The tag check above keys on the release identity; artifact names key
            # on the PACKAGE release (<version>-<iteration>), which is coarser.
            # A bare X.Y.Z packages as iteration 1 -- byte-identical to X.Y.Z-rc1
            # -- so building a bare GA for a version that already shipped an rc
            # would overwrite that rc's signed artifacts in the flat pools and
            # re-point its docker tag, with no tag collision to stop it. It would
            # also sort BELOW rc2 and later. GA is a JFrog promotion of the
            # passing rc, never a rebuild; enforce that rather than documenting it.
            if [[ "$VERSION" != *-* ]]; then
              rc_tags=$(git tag --list "${VERSION}-rc*" | tr '\n' ' ')
              if [[ -n "${rc_tags// /}" ]]; then
                echo "::error::VERSION '${VERSION}' already shipped as ${rc_tags% } -- promote the passing rc through JFrog instead of rebuilding. A bare '${VERSION}' emits the same '${VERSION}-1' artifact names and would overwrite it." >&2
                exit 1
              fi
            fi
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"

  get-version:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      VERSION: ${{ steps.compute.outputs.version }}
      BUILD_VERSION: ${{ steps.compute.outputs.build_version }}
      RELEASE: ${{ steps.release.outputs.RELEASE }}
      DEB_AMD64: ${{ steps.deb-name.outputs.amd64 }}
      DEB_ARM64: ${{ steps.deb-name.outputs.arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute VERSION (SemVer-aware for branch builds)
        id: compute
        env:
          BASE: ${{ needs.validate-inputs.outputs.VERSION }}
          SKIP_TAGGING: ${{ inputs.skip_tagging }}
        run: |
          set -euo pipefail
          # VERSION is the release identity (git tag, release bundle, build
          # number). BUILD_VERSION is what artifacts are named from and what
          # the binary is stamped with. They coincide on a main release; on a
          # dev build the sha alone pins it, so the branch slug and the rcN
          # stay out of package names and the iteration stays 1.
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${SKIP_TAGGING}" != "true" ]]; then
            VERSION="${BASE}"
            BUILD_VERSION="${BASE}"
          else
            BRANCH_SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | sed 's/[^A-Za-z0-9-]/-/g')
            SHORT_SHA="${GITHUB_SHA::9}"
            VERSION="${BASE}-${BRANCH_SLUG}-${SHORT_SHA}"
            BUILD_VERSION="$(.github/bin/pkg_release.sh "${BASE}" version)-${SHORT_SHA}"
          fi
          echo "VERSION:       ${VERSION}"
          echo "BUILD_VERSION: ${BUILD_VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Derive package version and iteration
        id: release
        env:
          BUILD_VERSION: ${{ steps.compute.outputs.build_version }}
        run: |
          set -euo pipefail
          .github/bin/pkg_release.sh "${BUILD_VERSION}" all | tee -a "$GITHUB_OUTPUT"

      # The name pkg/Makefile gives the .deb the docker image installs, emitted
      # once here because docker-verify builds the image and docker-build
      # publishes it -- deriving it twice is how the two drift apart. Format is
      # <name>_<pkg-version>-<iteration><distro>_<dpkg-arch>.deb. ubuntu24.04 of
      # all the distro builds: the image is based on ubuntu:24.04, the distro
      # that build's bundled libraries were linked against (docker/Dockerfile).
      - name: Derive the .deb names the docker image installs
        id: deb-name
        env:
          RELEASE: ${{ steps.release.outputs.RELEASE }}
        run: |
          set -euo pipefail
          [[ -n "${RELEASE}" ]] || { echo "ERROR: empty RELEASE" >&2; exit 1; }
          for arch in amd64 arm64; do
            echo "${arch}=aerospike-asbench_${RELEASE}ubuntu24.04_${arch}.deb"
          done | tee -a "$GITHUB_OUTPUT"

  build-artifacts:
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm]
        distro:
          - el8
          - el9
          - el10
          - amzn2023
          - debian12
          - debian13
          - ubuntu22.04
          - ubuntu24.04
          - ubuntu26.04
    runs-on: ${{ matrix.host }}
    container: >-
      ${{ matrix.distro == 'el8' && 'redhat/ubi8:8.10' ||
        matrix.distro == 'el9' && 'redhat/ubi9:9.6' ||
        matrix.distro == 'el10' && 'redhat/ubi10:10.0' ||
        matrix.distro == 'amzn2023' && 'amazonlinux:2023.9.20251208.0' ||
        matrix.distro == 'debian12' && 'debian:bookworm-20230411' ||
        matrix.distro == 'debian13' && 'debian:trixie-20251020' ||
        matrix.distro == 'ubuntu22.04' && 'ubuntu:jammy-20231004' ||
        matrix.distro == 'ubuntu24.04' && 'ubuntu:noble-20251013' ||
        matrix.distro == 'ubuntu26.04' && 'ubuntu:resolute-20260413' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install prereqs
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y git ca-certificates
              ;;
            el*|amzn*)
              command -v dnf >/dev/null || yum install -y dnf
              dnf -y install git ca-certificates
              ;;
          esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Install build dependencies
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/bin/install_deps.sh
          "install_deps_${{ matrix.distro }}"

      - name: Build and package
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          BUILD_DISTRO: ${{ matrix.distro }}
          # BUILD_VERSION, not PKG_VERSION: pkg/Makefile defines its own
          # PKG_VERSION (the rcN-stripped one), and an env var of that name
          # reaching make is only overridden by a make precedence rule -- so
          # `make -e` or a PKG_VERSION= command-line override would put rcN
          # back into the .deb file name.
          BUILD_VERSION: ${{ needs.get-version.outputs.BUILD_VERSION }}
        run: |
          set -euo pipefail
          source .github/bin/build_package.sh
          build_packages

      # Per-leg build-info: the environment and git revision each package was
      # built from. upload-artifacts-to-jfrog discovers these as children of
      # the release build-info through its jf-metadata-build-id prefix, so the
      # ID below must keep that prefix.
      #
      # Every part of this is best-effort, deliberately unlike the hard-failing
      # publish in shared-workflows' execute-build entrypoint: it runs once per
      # distro container per arch, and metadata about a package that
      # built, signed and tested clean is not worth failing a release over.
      # A leg that fails here still ships; it just goes missing from the
      # aggregated build-info, and says so as a warning.
      - name: Install JFrog CLI
        if: inputs.release == true
        continue-on-error: true
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-aerospike
          oidc-audience: database-gh-aerospike

      - name: Publish build-info
        if: inputs.release == true
        env:
          JF_BUILD_NAME: aerospike-asbench
          JF_BUILD_ID: ${{ needs.get-version.outputs.VERSION }}-metadata-${{ matrix.distro }}-${{ contains(matrix.host, 'arm') && 'aarch64' || 'x86_64' }}
        run: |
          set -euo pipefail
          # Guarded because the step above is allowed to fail.
          if ! command -v jf >/dev/null; then
            echo "::warning::JFrog CLI unavailable, skipping build-info for ${JF_BUILD_ID}"
            exit 0
          fi
          jf rt build-collect-env "$JF_BUILD_NAME" "$JF_BUILD_ID" --project=database \
            || echo "::warning::build-collect-env failed for ${JF_BUILD_ID}"
          jf rt build-add-git "$JF_BUILD_NAME" "$JF_BUILD_ID" --project=database \
            || echo "::warning::build-add-git failed for ${JF_BUILD_ID}"
          jf rt build-publish "$JF_BUILD_NAME" "$JF_BUILD_ID" --project=database \
            || echo "::warning::build-publish failed for ${JF_BUILD_ID}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unsigned-artifacts-${{ needs.get-version.outputs.VERSION }}-${{ matrix.distro }}-${{ contains(matrix.host, 'arm') && 'aarch64' || 'x86_64' }}
          path: pkg/target/
          retention-days: 1

  organize-built-artifacts:
    needs: [build-artifacts, get-version]
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-artifacts
          pattern: unsigned-artifacts-${{ needs.get-version.outputs.VERSION }}*
          merge-multiple: true
 
      - name: Upload packaged Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unsigned-artifacts-${{ needs.get-version.outputs.VERSION }}
          path: build-artifacts
          overwrite: true
          retention-days: 1

  sign-artifacts:
    needs:
      - get-version
      - organize-built-artifacts
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@mcbridem/infra-730-just-testing
    with:
      gh-artifact-name: signed-artifacts-${{ needs.get-version.outputs.VERSION }}
      gh-unsigned-artifacts: unsigned-artifacts-${{ needs.get-version.outputs.VERSION }}
      gh-workflows-ref: "mcbridem/infra-730-just-testing"
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  test-install-linux-and-execute:
    name: Test install & execute (${{ matrix.distro }}, ${{ contains(matrix.host, 'arm') && 'arm64' || 'amd64' }})
    needs: [get-version, sign-artifacts]
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm]
        distro:
          - el8
          - el9
          - el10
          - amzn2023
          - debian12
          - debian13
          - ubuntu22.04
          - ubuntu24.04
          - ubuntu26.04
    runs-on: ${{ matrix.host }}
    container: >-
      ${{ matrix.distro == 'el8' && 'redhat/ubi8:8.10' ||
        matrix.distro == 'el9' && 'redhat/ubi9:9.6' ||
        matrix.distro == 'el10' && 'redhat/ubi10:10.0' ||
        matrix.distro == 'amzn2023' && 'amazonlinux:2023.9.20251208.0' ||
        matrix.distro == 'debian12' && 'debian:bookworm-20230411' ||
        matrix.distro == 'debian13' && 'debian:trixie-20251020' ||
        matrix.distro == 'ubuntu22.04' && 'ubuntu:jammy-20231004' ||
        matrix.distro == 'ubuntu24.04' && 'ubuntu:noble-20251013' ||
        matrix.distro == 'ubuntu26.04' && 'ubuntu:resolute-20260413' }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install prereqs
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends git ca-certificates curl tar
              ;;
            el*|amzn*)
              # UBI 9 / AL2023 ship curl-minimal; installing "curl" conflicts with it.
              dnf -y install findutils git ca-certificates tar gzip
              ;;
          esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-artifacts-${{ needs.get-version.outputs.VERSION }}
          path: ./packages

      - name: Install package locally
        run: |
          set -euo pipefail
          deb_arch="${{ contains(matrix.host, 'arm') && 'arm64' || 'amd64' }}"
          rpm_arch="${{ contains(matrix.host, 'arm') && 'aarch64' || 'x86_64' }}"
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              export DEBIAN_FRONTEND=noninteractive
              pkg=$(find ./packages -name "*${{ matrix.distro }}_${deb_arch}.deb" | head -1)
              [[ -n "${pkg}" ]] || { echo "ERROR: no .deb found for ${{ matrix.distro }}/${deb_arch}" >&2; exit 1; }
              apt-get install -y "${pkg}"
              ;;
            el*|amzn*)
              pkg=$(find ./packages -name "*.${{ matrix.distro }}.${rpm_arch}.rpm" | head -1)
              [[ -n "${pkg}" ]] || { echo "ERROR: no .rpm found for ${{ matrix.distro }}/${rpm_arch}" >&2; exit 1; }
              dnf install -y "${pkg}"
              ;;
          esac

      - name: Install bats
        env:
          BATS_VERSION: "1.11.0"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o /tmp/bats.tgz
          tar -xzf /tmp/bats.tgz -C /tmp
          "/tmp/bats-core-${BATS_VERSION}/install.sh" /usr/local
          bats --version

      - name: Verify installation
        env:
          EXPECTED_VERSION: ${{ needs.get-version.outputs.BUILD_VERSION }}
        run: bats .github/bin/test/test_execute.bats

  organize-signed-artifacts:
    name: Organize signed artifacts for deploy
    needs: [get-version, test-install-linux-and-execute]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-artifacts-${{ needs.get-version.outputs.VERSION }}
          path: signed-artifacts

      - name: Extract package files (flatten paths)
        run: |
          set -euo pipefail
          mkdir -p deploy-artifacts
          find signed-artifacts/ -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.tgz' -o \
            -name '*.tar' -o -name '*.dmg' -o -name '*.pkg' -o \
            -name '*.exe' -o -name '*.asc' -o -name '*.sha256' \
          \) -exec cp -t deploy-artifacts/ {} +
          count=$(find deploy-artifacts/ -maxdepth 1 -type f | wc -l)
          echo "Deploy artifacts: ${count} file(s)"
          ls -la deploy-artifacts/
          [[ ${count} -gt 0 ]] || { echo "ERROR: no deploy artifacts found" >&2; exit 1; }
      - name: Upload deploy artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deploy-artifacts-${{ needs.get-version.outputs.VERSION }}
          path: deploy-artifacts/
          retention-days: 1

  # Provenance is bound to what actually ships, so it runs after signing:
  # signing rewrites the deb/rpm in place, and an attestation of the unsigned
  # digest would never verify against the file a customer downloads.
  attest-artifacts:
    name: Attest build provenance
    if: inputs.release == true
    needs:
      - get-version
      - organize-signed-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Download deploy artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-artifacts-${{ needs.get-version.outputs.VERSION }}
          path: deploy-artifacts

      - name: Stage installable packages
        run: |
          set -euo pipefail
          # Detached signatures and checksums describe a package rather than
          # being build outputs of their own, so they get no provenance.
          mkdir -p attest
          find deploy-artifacts/ -maxdepth 1 -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.tgz' -o \
            -name '*.tar' -o -name '*.pkg' -o -name '*.exe' \
          \) -exec cp -t attest/ {} +
          count=$(find attest/ -maxdepth 1 -type f | wc -l)
          echo "Attesting ${count} package(s)"
          ls -la attest/
          [[ ${count} -gt 0 ]] || { echo "ERROR: no packages to attest" >&2; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: attest/*

  upload-artifacts-to-jfrog:
    needs:
      - get-version
      - organize-signed-artifacts
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@v3.7.0
    with:
      jf-project: database
      jf-build-name: "aerospike-asbench"
      version: ${{ needs.get-version.outputs.VERSION }}
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike
      gh-artifact-name: deploy-artifacts-${{ needs.get-version.outputs.VERSION }}
      gh-retention-days: 1
      dry-run: ${{ inputs.release != true }}
      jf-build-id: ${{ needs.get-version.outputs.VERSION }}
      jf-metadata-build-id: ${{ needs.get-version.outputs.VERSION }}-metadata
      gh-workflows-ref: "v3.7.0"

  # Pre-publish gate. reusable_docker-build-deploy pushes from inside its build
  # leg and offers no test hook, so once it runs there is no point at which a
  # broken image has not already reached dev-local under a moving tag. This
  # builds the same image the same way, exercises it, and publishes nothing --
  # docker-build needs it, so nothing is pushed until it passes.
  #
  # Unconditional, unlike docker-build's push and docker-test: a dry run has to
  # exercise the image, and this is the only job that can.
  docker-verify:
    name: Docker build & smoke test (${{ matrix.arch }})
    needs: [get-version, organize-signed-artifacts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same artifact and same in-context path docker-build hands the shared
      # workflow through gh-context-artifacts-json, so this builds from the
      # bytes that will be published, not a rebuild of them.
      - name: Download deploy artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-artifacts-${{ needs.get-version.outputs.VERSION }}
          path: ./deploy-artifacts

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1304.3

      - name: Build the image (no push)
        env:
          DEB_AMD64: ${{ needs.get-version.outputs.DEB_AMD64 }}
          DEB_ARM64: ${{ needs.get-version.outputs.DEB_ARM64 }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --file docker/Dockerfile \
            --build-arg ASBENCH_LOCAL_PKG_AMD64="deploy-artifacts/${DEB_AMD64}" \
            --build-arg ASBENCH_LOCAL_PKG_ARM64="deploy-artifacts/${DEB_ARM64}" \
            --load -t asbench-verify:${{ matrix.arch }} .

      - name: Smoke test
        env:
          IMAGE: asbench-verify:${{ matrix.arch }}
          BUILD_VERSION: ${{ needs.get-version.outputs.BUILD_VERSION }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          # Reuse the linux-install bats smoke test against the image by
          # shimming the tool binaries to `docker run` calls.
          sudo apt-get update -qq && sudo apt-get install -y bats
          SHIM_DIR=$(mktemp -d)
          cat > "${SHIM_DIR}/asbench" <<EOF
          #!/bin/sh
          exec docker run --rm "${IMAGE}" asbench "\$@"
          EOF
          chmod +x "${SHIM_DIR}/asbench"
          PATH="${SHIM_DIR}:${PATH}" EXPECTED_VERSION="${BUILD_VERSION}" bats .github/bin/test/test_execute.bats

          # Catches a mis-tagged or stale-cached image that the shimmed bats
          # run cannot see. Same assertion the bats suite uses -- the tool
          # splits the version across "Version"/"Build" lines, so a substring
          # match on BUILD_VERSION would never hold.
          source .github/bin/test/version_lib.sh
          assert_version_output "$(docker run --rm "${IMAGE}" asbench --version)" "${BUILD_VERSION}"

          # The pre-13.0.3 wrapper exported LC_CTYPE=C.UTF-8; the Dockerfile now
          # sets it as ENV. Assert glibc resolves a UTF-8 charmap in the image.
          CHARMAP=$(docker run --rm --entrypoint sh "${IMAGE}" -c 'locale charmap') \
            || { echo "ERROR: could not read the locale charmap from ${IMAGE}" >&2; exit 1; }
          [[ "${CHARMAP}" == "UTF-8" ]] \
            || { echo "ERROR: image locale charmap is '${CHARMAP//$'\n'/ }', expected UTF-8" >&2; exit 1; }

          # LC_CTYPE is pinned so a LANG override to an ungenerated locale cannot
          # drop the ctype back to ASCII. Without this the pin could be trimmed to
          # LANG alone and the assertion above would stay green.
          CHARMAP=$(docker run --rm -e LANG=en_US.UTF-8 --entrypoint sh "${IMAGE}" -c 'locale charmap') \
            || { echo "ERROR: could not read the locale charmap from ${IMAGE} under a LANG override" >&2; exit 1; }
          [[ "${CHARMAP}" == "UTF-8" ]] \
            || { echo "ERROR: LANG override drops the charmap to '${CHARMAP//$'\n'/ }', expected UTF-8 (LC_CTYPE pin lost?)" >&2; exit 1; }

          # Entrypoint contract (TOOLS-4360). Naming the binary is the convention
          # for these images, so an image invoked without one has to say so
          # rather than fail with runc's "executable file not found in $PATH".
          # test_entrypoint.bats pins the script against a fixture on every PR;
          # this runs the same contract against the built image, which is what
          # catches a lost exec bit, a missing tool list, or a Dockerfile that
          # dropped the ENTRYPOINT or grew a CMD back.
          bins=(asbench)
          [[ -z "$(docker inspect -f '{{join .Config.Cmd " "}}' "${IMAGE}")" ]] \
            || { echo "ERROR: the image has a CMD; a default binary would hide the usage message" >&2; exit 1; }
          usage=$(docker run --rm "${IMAGE}") \
            || { echo "ERROR: the image failed to print usage with no arguments" >&2; exit 1; }
          # The title is the first line, "Aerospike <name> image (<package> <version>)":
          # exactly two tokens in the parentheses -- an earlier build printed the
          # package name twice.
          title_re='^Aerospike [a-z]+ image \([^() ]+ [^() ]+\)$'
          [[ "$(head -n1 <<<"${usage}")" =~ ${title_re} ]] \
            || { echo "ERROR: unexpected usage title: '$(head -n1 <<<"${usage}")'" >&2; exit 1; }
          for bin in "${bins[@]}"; do
            grep -qE "^  docker run --rm <image> ${bin}( |$)" <<<"${usage}" \
              || { echo "ERROR: the usage message does not list ${bin}" >&2; exit 1; }
          done
          grep -qF -- '--entrypoint bash' <<<"${usage}" \
            || { echo "ERROR: the usage message does not say how to get a shell" >&2; exit 1; }

          # 127 exactly: 126 means the entrypoint lost its exec bit and 1 or 2
          # mean it crashed, and neither must read as a correct refusal. Usage
          # on error belongs on stderr, so `docker run IMAGE --x > file` leaves
          # the file empty. set +e because under set -e the non-zero exit would
          # end the step before the assertion runs.
          set +e
          docker run --rm "${IMAGE}" --version >"${SHIM_DIR}/ep.out" 2>"${SHIM_DIR}/ep.err"; rc=$?
          set -e
          [[ "${rc}" -eq 127 ]] \
            || { echo "ERROR: a leading-flag first argument exited ${rc}, expected 127" >&2; exit 1; }
          [[ ! -s "${SHIM_DIR}/ep.out" ]] \
            || { echo "ERROR: the refusal wrote to stdout; usage on error belongs on stderr" >&2; exit 1; }
          grep -qF "Error: '--version' is an option, not a binary." "${SHIM_DIR}/ep.err" \
            || { echo "ERROR: the refusal did not name the bad argument on stderr" >&2; exit 1; }
          grep -qE "^  docker run --rm <image> ${bins[0]}( |$)" "${SHIM_DIR}/ep.err" \
            || { echo "ERROR: the refusal did not print usage on stderr" >&2; exit 1; }
          set +e
          docker run --rm "${IMAGE}" no-such-tool >"${SHIM_DIR}/ep.out" 2>"${SHIM_DIR}/ep.err"; rc=$?
          set -e
          [[ "${rc}" -eq 127 ]] \
            || { echo "ERROR: an unknown first argument exited ${rc}, expected 127" >&2; exit 1; }
          grep -qF "Error: 'no-such-tool' is not an executable in this image." "${SHIM_DIR}/ep.err" \
            || { echo "ERROR: the unknown-argument refusal did not name the argument on stderr" >&2; exit 1; }

          # Passthrough: anything executable runs as given, so the entrypoint is
          # additive. `docker run IMAGE bash`, pod specs that set only args:, and
          # diagnostics such as `docker run IMAGE ls` keep working.
          set +e
          docker run --rm "${IMAGE}" sh -c 'exit 3'; rc=$?
          set -e
          [[ "${rc}" -eq 3 ]] \
            || { echo "ERROR: passthrough of \"sh -c 'exit 3'\" exited ${rc}, expected 3" >&2; exit 1; }
          docker run --rm --entrypoint bash "${IMAGE}" -c true \
            || { echo "ERROR: --entrypoint bash no longer gives a shell" >&2; exit 1; }

          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            snyk container test "${IMAGE}" \
              --platform=linux/${{ matrix.arch }} \
              --file=docker/Dockerfile || true
          fi

  # Image build/publish/attest is delegated to shared-workflows: it builds each
  # platform on a native runner, pushes by digest, stitches one manifest list,
  # publishes the docker build-info and attests the index. docker-build.sh is
  # still the local/manual path; CI no longer drives it.
  #
  # v4.1.0 is the current shared-workflows release and is pinned ahead of the
  # v3.7.0 used elsewhere in this file because gh-context-artifacts-json --
  # which puts the signed .deb inside the build context -- only exists from
  # v4.1.0. Without it the image could only install a package downloaded from
  # a URL, i.e. not the artifact this run just signed.
  docker-build:
    name: Docker build & publish
    needs: [get-version, organize-signed-artifacts, docker-verify]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@v4.1.0
    with:
      # RELEASE, not BUILD_VERSION: on a release BUILD_VERSION is the raw
      # VERSION file value, rcN included, and app-version feeds the immutable
      # <app-version>_<timestamp> tag that is always emitted. Passing it would
      # tag <version>-rcN_<ts> and break the invariant stated at the top of
      # this file and in pkg_release.sh -- rcN belongs in the package
      # iteration, never in a file name or image tag.
      app-version: ${{ needs.get-version.outputs.RELEASE }}
      app-name: Aerospike asbench
      image-name: aerospike-asbench
      jf-project: database
      jf-build-name: aerospike-asbench-docker
      repo-scope: -docker-dev-local
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike
      context: .
      file: docker/Dockerfile
      platforms: linux/amd64,linux/arm64
      # Still runs on a dry run, publishing nothing. The image itself is
      # already covered by docker-verify; what only this exercises is the
      # shared-workflow wiring -- gh-context-artifacts-json placement and
      # build-args-json parsing -- which would otherwise be first tried
      # during a real release.
      push: ${{ inputs.release == true }}
      # At v4.1.0 the default tag set is <RELEASE>, the bare major, and
      # "latest"; neither of the last two may move on an rc build, so this
      # pins the set to exactly <RELEASE>. shared-workflows after v4.1.0
      # (INFRA-727) drops latest/major from the default, which makes this
      # belt-and-braces rather than load-bearing -- keep it through that bump.
      versions-override: ${{ needs.get-version.outputs.RELEASE }}
      gh-context-artifacts-json: '[{"name": "deploy-artifacts-${{ needs.get-version.outputs.VERSION }}", "dest": "deploy-artifacts"}]'
      # The Dockerfile installs this path from the build context instead of
      # downloading a release URL. Names come from get-version so docker-verify
      # builds and this publishes the same file.
      build-args-json: '{"ASBENCH_LOCAL_PKG_AMD64": "deploy-artifacts/${{ needs.get-version.outputs.DEB_AMD64 }}", "ASBENCH_LOCAL_PKG_ARM64": "deploy-artifacts/${{ needs.get-version.outputs.DEB_ARM64 }}"}'

  # Post-publish confirmation, not the gate -- docker-verify already exercised
  # this image before anything was pushed. What is only checkable after the
  # fact is the part the shared workflow owns: that the manifest list it
  # stitched resolves, and that each arch pulls and runs from the index digest
  # that was attested. Each arch is pulled on its own native runner.
  docker-test:
    name: Docker published-image check (${{ matrix.arch }})
    if: inputs.release == true
    needs: [get-version, docker-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-aerospike
          oidc-audience: database-gh-aerospike

      - name: Docker login to Artifactory
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Check the published image
        env:
          IMAGE: ${{ needs.docker-build.outputs.image-ref }}
          BUILD_VERSION: ${{ needs.get-version.outputs.BUILD_VERSION }}
        run: |
          set -euo pipefail
          [[ -n "${IMAGE}" ]] || { echo "ERROR: docker-build produced no image-ref" >&2; exit 1; }
          docker pull "${IMAGE}"

          # Confirm the index really resolved to this leg's arch, so an arm64
          # failure can never be masked by silently checking the amd64 manifest.
          got=$(docker image inspect "${IMAGE}" --format '{{.Architecture}}')
          [[ "${got}" == "${{ matrix.arch }}" ]] \
            || { echo "ERROR: pulled ${got} image on ${{ matrix.arch }} runner" >&2; exit 1; }

          # Behaviour is docker-verify's job; this only has to prove the
          # manifest that got published is the build that passed there.
          source .github/bin/test/version_lib.sh
          assert_version_output "$(docker run --rm "${IMAGE}" asbench --version)" "${BUILD_VERSION}"

  # Release bundles are JFrog's promotion unit; produced on every publish
  # regardless of branch or skip_tagging.
  create-release-bundle:
    if: inputs.release == true
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs:
      - get-version
      - attest-artifacts
      - upload-artifacts-to-jfrog
      - docker-build
      - docker-test
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@v3.7.0
    with:
      jf-project: "database"
      # The package build-info is still published under VERSION by
      # upload-artifacts-to-jfrog, but reusable_docker-build-deploy records the
      # image build-info under the JFrog CLI default build number
      # (github.run_number). The two names are versioned differently on purpose.
      jf-build-names: "aerospike-asbench:${{ needs.get-version.outputs.VERSION }},aerospike-asbench-docker:${{ github.run_number }}"
      jf-bundle-name: "aerospike-asbench"
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike
      version: ${{ needs.get-version.outputs.VERSION }}
      gh-workflows-ref: v3.7.0
      dry-run: false

  # Tag-last: created only after every publish step succeeds. A failure
  # anywhere upstream means no tag, no draft release, no inconsistent state.
  # Tagging is main-only; non-main dispatches never produce a tag.
  # skip_tagging also suppresses tagging on main (feature-style main build).
  create-tag:
    name: Create git tag (release marker)
    if: inputs.release == true && github.ref == 'refs/heads/main' && inputs.skip_tagging != true
    needs:
      - validate-inputs
      - get-version
      - attest-artifacts
      - upload-artifacts-to-jfrog
      - docker-build
      - docker-test
      - create-release-bundle
    runs-on: ubuntu-24.04
    environment: deploy-to-main
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push tag
        env:
          VERSION: ${{ needs.get-version.outputs.VERSION }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag '${VERSION}' already exists -- it was created between validate-inputs and here. Bump VERSION to the next -rcN and re-run." >&2
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"
          echo "Pushed tag: $VERSION"

  promote-to-test:
    name: Promote release bundle to TEST
    if: github.ref == 'refs/heads/main'
    needs: [get-version, create-release-bundle]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-aerospike
          oidc-audience: database-gh-aerospike

      - name: Promote release bundle to TEST
        env:
          JFROG_PROJECT: database
          RELEASE_BUNDLE_NAME: aerospike-asbench
          JF_SIGNING_KEY: aerospike
          VERSION: ${{ needs.get-version.outputs.VERSION }}
        run: |
          set -euo pipefail
          # Check if already promoted to TEST; surface any API error rather than swallowing it.
          resp=$(jf rt curl -s -XGET "/lifecycle/api/v2/promotion/records/${RELEASE_BUNDLE_NAME}/${VERSION}?project=${JFROG_PROJECT}" 2>/dev/null) || {
            echo "Warning: could not query promotion status — proceeding with promotion attempt."
            resp=""
          }
          status=$(echo "$resp" | jq -r '.promotions[]? | select(.environment == "TEST") | .status' 2>/dev/null || true)
          if [[ "$status" == "COMPLETED" ]]; then
            echo "Release bundle '${RELEASE_BUNDLE_NAME}:${VERSION}' is already promoted to TEST — skipping."
            exit 0
          fi
          echo "Promoting release bundle '${RELEASE_BUNDLE_NAME}:${VERSION}' to TEST environment..."
          jf rbp \
            --signing-key="${JF_SIGNING_KEY}" \
            --project="${JFROG_PROJECT}" \
            --sync=true \
            "${RELEASE_BUNDLE_NAME}" "${VERSION}" TEST

  notify-slack:
    name: Notify Slack
    needs: [get-version, promote-to-test]
    if: always() && needs.promote-to-test.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Set Slack message text
        id: slack_text
        env:
          SLACK_TITLE: aerospike-asbench ${{ env.VERSION }} promoted to JFrog TEST
        run: |
          set -euo pipefail
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          SLACK_MSG="*Product:* aerospike-asbench"$'\n'"*Branch:* ${BRANCH}"$'\n'"*Bundle Version:* ${VERSION}"$'\n'"*Triggered by:* ${ACTOR}"$'\n'"*Run:* #${RUN_NUMBER}"$'\n'"*Time:* ${timestamp}"
          delimiter="SLACK_$(openssl rand -hex 8)"
          {
            echo "title<<${delimiter}"
            echo "$SLACK_TITLE"
            echo "${delimiter}"
            echo "body<<${delimiter}"
            echo "$SLACK_MSG"
            echo "${delimiter}"
            echo "workflow_mrk<<${delimiter}"
            echo "<${RUN_URL}|Workflow run #${RUN_NUMBER}>"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack message to TOOLS
        continue-on-error: true
        uses: step-security/slack-github-action@16410fbfd088e8034b2d1cda051d29ada4097065 # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.TOOLS_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.TOOLS_SLACK_CHANNEL }}",
              "text": ${{ toJSON(steps.slack_text.outputs.title) }},
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": ${{ toJSON(steps.slack_text.outputs.title) }}, "emoji": true } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_text.outputs.body) }} } },
                { "type": "section", "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.slack_text.outputs.workflow_mrk) }} } }
              ]
            }
